<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Välkommen till vår restaurang – bläddra i vår meny och beställ enkelt online.">
    <title>Restaurang</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body id="body">

    <header>
        <img src="images/luckyducklogo.png" alt="Restaurang logga" class="imgLogo">
    </header>
    <main>
        <div class="container">
            <h1 class="vårMenyText" id="vårMenyText">Vår meny</h1>
            <div class="filter">
                <h2 id="filterlangtitle">Språk</h2>
                <div class="sprak">
                    
                    <input type="radio" value="engelska" name="språk" id="engelskaKnapp">
                    <label for="engelskaKnapp" id="englishLabel">English</label>

                    <input type="radio" value="Svenska" name="språk" checked id="svenskaKnapp">
                    <label for="svenskaKnapp" id="swedishLabel">Svenska</label>
                </div>
                <div>
                    
                </div>
                <div class="allergier">
                    <h2 id="allergiesText">Allergier</h2>
                    <div>
                        <input type="checkbox" name="allergier" id="gluten">
                        <label for="gluten" id="glutenLabel">Gluten</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" name="allergier" id="laktos">
                        <label for="laktos" id="laktosLabel">Laktos</label>
                    </div>

                    <div>
                        <input type="checkbox" name="allergier" id="ägg">
                        <label for="ägg" id="äggLabel" >Ägg</label>
                    </div>
                    
                </div>

                <div class="köttSort">
                    <h2 id="köttSorterText">Köttsorter</h2>

                    <div>
                        <input type="checkbox" name="köttTyper" id="vegetarisk">
                        <label for="vegetarisk" id="vegetariskLabel">Vegetarisk</label>
                    </div>
                    <div>
                        <input type="checkbox" name="köttTyper" id="nötkött">
                        <label for="nötkött" id="nötLabel">Nöt</label>
                    </div>
                    <div>
                        <input type="checkbox" name="köttTyper" id="fläsk">
                        <label for="fläsk" id="fläskLabel">Fläsk</label>
                    </div>
                    <div>
                        <input type="checkbox" name="köttTyper" id="fisk">
                        <label for="fisk" id="fiskLabel">Fisk</label>
                    </div>
                    <div>
                        <input type="checkbox" name="köttTyper" id="kyckling">
                        <label for="kyckling" id="kycklingLabel">Kyckling</label>
                    </div>
                    <div>
                        <input type="checkbox" name="köttTyper" id="skaldjur">
                        <label for="skaldjur" id="skaldjurLabel">Skaldjur</label>
                    </div>
                    
                </div>

                <div class="sortera">
                    <label for="order" id="sorteraLabel">Sortera</label>
                    <select id="order">
                        <option value="standard" id="standardOptionLabel">Standard</option>
                        <option value="pris" id="prisOptionLabel">Pris</option>
                    </select>
                </div>

                <div class="ordning">
                    <h2 id="ordningText">Ordning</h2>
                    <input type="radio" name="ordning" id="fallandeRadio" checked>
                    <label for="fallandeRadio" id="fallandeLabel">Fallande</label>
                    <input type="radio" name="ordning" id="stigandeRadio">
                    <label for="stigandeRadio" id="stigandeLabel">Stigande</label>
                </div>
                
            </div>


            <h3 id="rätterLabel">Rätter</h3>
            <div class="breaker"></div>  


            <div class="rätter">
                <!-- <section>
                    <div class="vänsterRätter">
                        <h3>Spagetti och köttfärssås</h3>
                        <p class="rättBeskrivning">Spagetti och köttfärssås</p>
                        <div class="maträttAllergier">
                            <span>Laktos</span>
                            <span>Gluten</span>
                            <span>Nöt/Fläsk</span>
                        </div>

                        
                    </div>
                    <div class="högerRätter">
                        <p class="priceText">149kr</p>
                        <button id="addToCartButton">+</button>
                    </div>
                    
                </section> -->
            </div>

            <div class="varukorgDiv">
                <div class="over">
                    <div class="overLeft">
                        <h2 id="varukorgText">Varukorg</h2>
                        <p id="antalIVarukorg">0</p>        
                    </div>
                    
                    <button id="tömVarukorgKnapp">Töm</button>
                </div>

                <!-- Kommer ändras när det läggs till i listan -->
                <div class="varukorgLista">
                    <p id="tomVarukorgText">Din varukorg är tom</p>
                </div>

                <div class="under">
                    <p id="totaltLabel">TOTALT</p>
                    <p id="totalKostnad">0 kr</p>
                </div>

            </div>
        </div>
    </main>
    <footer>
        <p id="luckyDuckRubrikText">* Restaurang Lucky Duck</p>
        <p id="sedanText">* Sedan 2026</p>
    </footer>
</body>
</html>
