<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="styleKontakt.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="images/logo_placeholder.png" alt="Restaurang logga" class="imgLogoKontakt"></a>
        <img src="images/cart.png" alt="Varukorg" class="imgCartKontakt">
    </header>
    <main>
        <fieldset id="contactField">
            <legend>Kontakt</legend>

            <div class="inputs">
                <label for="emailInput">Email:</label>
                <input type="email" id="emailInput">
                <label for="textArea">Meddelande:</label>
                <textarea id="textArea"></textarea>

                <button type="submit">Skicka</button>
            </div>
        </fieldset>
    </main>
    <footer>

    </footer>
</body>
</html>
